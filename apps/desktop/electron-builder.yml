# Packaging config: turns the built app (out/) into installers.
# Run `pnpm package` from the repo root. Output goes to apps/desktop/release/.
# Docs: https://www.electron.build/configuration
appId: dev.trellis.app
productName: Trellis
executableName: trellis
copyright: Copyright © Trellis contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
# JavaScript is bundled into out/ by electron-vite. Native modules (only
# @parcel/watcher, the file watcher) stay in node_modules and are packaged
# from the app's `dependencies`.
#
# electron-builder skips *transitive* optional dependencies, which is where
# @parcel/watcher keeps its per-platform binaries. So package.json lists
# those platform packages in `optionalDependencies` directly; pnpm installs
# only the one matching the current OS/CPU. Keep their version in sync with
# @parcel/watcher when upgrading it.
#
# The binaries use Node-API, which is stable across Node/Electron versions,
# so no rebuild for Electron is needed.
npmRebuild: false
# Built-in plugins (the repository's plugins/ folder) go in the resources
# folder; main/plugins/plugin-ipc.ts loads them from there. Their tests and
# dev-only files are left out.
extraResources:
  - from: ../../plugins
    to: plugins
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/*.test.js'
      - '!**/tsconfig.json'
win:
  target: [nsis]
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # The zip is what auto-update downloads on macOS; the dmg is for people.
  target: [dmg, zip]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Trellis contributors
  executableName: trellis
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}
# Where auto-update looks for new versions (main/services/updater.ts). The
# release workflow uploads the latest*.yml files it reads; building with
# `--publish never` (as CI does) still writes them, it just doesn't upload.
publish:
  provider: github
  owner: ziggfreed
  repo: Trellis
# Code signing and notarisation turn on automatically when the release
# workflow provides certificates (CSC_LINK etc.); see docs/RELEASING.md.
