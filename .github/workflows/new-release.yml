# Starts a new release from main in one click: Actions > "New release" >
# Run workflow, then pick how big the change is.
#
#   1. Works out the version: the latest v* tag bumped by patch/minor/major,
#      or an exact version you type (e.g. 1.0.0-beta.1).
#   2. Sets it in apps/desktop/package.json and moves CHANGELOG.md's
#      "Unreleased" notes under it (scripts/release/prepare-release.mjs).
#      Stops if there are no unreleased notes.
#   3. Commits that to a new branch, release/vX.Y.Z, and opens a pull request
#      for it. main only accepts changes through pull requests, so the
#      workflow never pushes to main itself.
#   4. When you merge that pull request, tag-release.yml tags the merge commit
#      and runs the Release workflow (release.yml), which builds the
#      installers and creates a DRAFT release. Nothing reaches users until you
#      review the draft and click "Publish release".
#
# Needs the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General > Workflow permissions).
#
# Tick "Dry run" to see the version and notes it would use, changing nothing.
# The full guide is docs/RELEASING.md.
name: New release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How big a change? patch = fixes, minor = new features, major = breaking changes'
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: 'Or an exact version instead (e.g. 1.0.0-beta.1). Leave empty to use the bump above.'
        type: string
        required: false
      dry_run:
        description: 'Dry run: only show what would be released'
        type: boolean
        default: false

# Never prepare two releases at once.
concurrency:
  group: new-release
  cancel-in-progress: false

permissions:
  contents: write # push the release branch
  pull-requests: write # open the release pull request

jobs:
  prepare:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch (it was run on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the version and update the changelog
        id: prepare
        env:
          REQUEST: ${{ inputs.version || inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/release/prepare-release.mjs "$REQUEST" $DRY_RUN
      - name: Summary
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## Dry run: would release $TAG"; else echo "## Preparing $TAG (merge the release pull request to build it)"; fi
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push a release branch and open a pull request
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/desktop/package.json CHANGELOG.md
          git commit -m "chore(release): $TAG"
          # Fails if the branch already exists (an earlier release pull
          # request for this version): merge or close that one first.
          git push origin "$branch"
          {
            echo "Merging this pull request releases **$TAG**: it sets the version in \`apps/desktop/package.json\` and moves the Unreleased notes in \`CHANGELOG.md\` under $TAG."
            echo
            echo "When it's merged, the **Tag release** workflow tags the merge commit and builds the installers into a **draft** GitHub release. Nothing reaches users until the draft is published."
            echo
            echo "To cancel, close this pull request and delete the branch."
            echo
            echo "## Release notes"
            echo
            cat release-notes.md
          } > pr-body.md
          url=$(gh pr create --base main --head "$branch" --title "chore(release): $TAG" --body-file pr-body.md)
          echo "Opened $url"
          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
