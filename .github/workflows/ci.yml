# Runs on every pull request, and by hand (Actions > CI > Run workflow).
#   checks  - lint, formatting and type checking (fast, Linux only)
#   test    - unit + end-to-end tests on Windows, macOS and Linux
#   package - builds unsigned installers for all three platforms (manual runs
#             only, to try a build without making a release)
#
# There's no run on push to main: main only changes through pull requests,
# and a pull request's run already tests the branch merged into main, so a
# second run after merging would repeat it.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Show page snapshots of failed tests
        # Playwright saves what was on screen when a test failed. Printing it
        # makes failures readable straight from the job log.
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r f; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installers (unsigned)
        run: pnpm package --publish never
        env:
          # Code signing is not set up yet; stop electron-builder looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: trellis-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
          retention-days: 14
