# Builds installers for Windows, macOS and Linux and attaches them to a
# DRAFT GitHub Release. Nothing is published until a maintainer reviews the
# draft and clicks "Publish release".
#
# The full guide (signing, auto-update) is docs/RELEASING.md.
#
# To make a release:
#   1. Set "version" in apps/desktop/package.json, and in CHANGELOG.md rename
#      "## [Unreleased]" to "## [x.y.z] - <date>" (add a new empty Unreleased
#      section above it). The release notes are taken from that section.
#   2. Merge to main, then tag that commit and push the tag:
#        git tag v0.1.0
#        git push origin v0.1.0
#      The tag must match the version exactly, or the build stops.
#   3. Wait for this workflow, then review and publish the draft release.
#
# Code signing: the builds are signed (and notarised on macOS) when the
# repository has the secrets listed in docs/RELEASING.md. Without them they
# are unsigned, so Windows SmartScreen and macOS Gatekeeper warn users, and
# unsigned macOS builds can't update themselves.
#
# Auto-update: installed copies of Trellis check the latest *published*
# release for the latest*.yml files uploaded here, so publishing the draft is
# what rolls an update out.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version ($version)."
            echo "Set \"version\" in apps/desktop/package.json to ${GITHUB_REF_NAME#v}, add a"
            echo "\"## [${GITHUB_REF_NAME#v}]\" section to CHANGELOG.md, merge that to main, then"
            echo "delete this tag and tag the new commit (see the steps at the top of this file)."
            exit 1
          fi
      - run: pnpm test
      - name: Build installers
        run: pnpm package --publish never
        env:
          # Don't pick up random certificates from the runner's keychain;
          # only the ones passed in below (if any) are used.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Signing certificate (.p12/.pfx, base64) and its password. Empty
          # when the secrets aren't set, which means "build unsigned".
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS notarisation (Apple ID with an app-specific password).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          # Take the section for this version: from its "## [x.y.z]" heading to the next "## ".
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes:"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Trellis ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*
