# Builds installers for Windows, macOS and Linux and attaches them to a
# DRAFT GitHub Release. Nothing is published until a maintainer reviews the
# draft and clicks "Publish release".
#
# To make a release:
#   1. Set "version" in apps/desktop/package.json and update CHANGELOG.md.
#   2. Merge to main, then tag that commit and push the tag:
#        git tag v0.1.0
#        git push origin v0.1.0
#   3. Wait for this workflow, then review and publish the draft release.
#
# The builds are not code-signed yet, so Windows SmartScreen and macOS
# Gatekeeper will warn users when they open them.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi
      - run: pnpm test
      - name: Build installers (unsigned)
        run: pnpm package --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          # Take the section for this version: from its "## [x.y.z]" heading to the next "## ".
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes:"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Trellis ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*
